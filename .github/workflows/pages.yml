# Publishes the landing page (index.html), the idea cloud (ideas/) and the
# Technophage MVP game files (technophage/mvp/) to GitHub Pages.
# Nothing else is published: nothing else under technophage/, archived material,
# agent config, mastermind state, the devlog and other sub-project folders stay
# out of the site.
name: Deploy to GitHub Pages

# Deploys on every push to main, and can be started by hand. Each deploy
# replaces the whole live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: git ls-files -z 'ideas/*.js' 'technophage/mvp/*.js' | xargs -0 -r -n1 node --check

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ ! -f ideas/index.html ]; then
            echo "::error::ideas/index.html not found: the idea cloud has not been committed yet"
            exit 1
          fi
          if [ ! -f technophage/mvp/index.html ]; then
            echo "::error::technophage/mvp/index.html not found: the Technophage MVP has not been committed yet"
            exit 1
          fi
          mkdir -p _site/ideas _site/technophage/mvp
          cp index.html _site/
          cp -r ideas/. _site/ideas/
          cp -r technophage/mvp/. _site/technophage/mvp/
          # the game fetches version.json (relative to its page) to show the build
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/technophage/mvp/version.json
          # list what upload-pages-artifact publishes: it skips hidden files
          # and follows symlinks
          find -L _site \( -name '.*' -prune \) -o -type f -print | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
