# Publishes the landing page (index.html) and the idea cloud (ideas/) to GitHub Pages.
# Nothing else in the repo is published: archived material, agent config,
# mastermind state, the devlog and sub-project folders stay out of the site.
name: Deploy to GitHub Pages

# Manual only: running it replaces the whole live site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: git ls-files -z 'ideas/*.js' | xargs -0 -r -n1 node --check

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ ! -f ideas/index.html ]; then
            echo "::error::ideas/index.html not found: the idea cloud has not been committed yet"
            exit 1
          fi
          mkdir -p _site/ideas
          cp index.html _site/
          cp -r ideas/. _site/ideas/
          # list what upload-pages-artifact publishes: it skips hidden files
          # and follows symlinks
          find -L _site \( -name '.*' -prune \) -o -type f -print | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
