# Publishes the landing page (index.html and its link preview image
# og-image.png), the idea cloud (ideas/), the
# Technophage MVP game files (technophage-mvp/), the Berserker 7 game
# (berserker7/, built from berserker7/game/), the Berserker 7 development
# pages (berserker7/dev/: index, feature tracker, milestone retros) and the
# forwarding page for the tracker's old address (berserker7/tracker/) to
# GitHub Pages.
# Nothing else in the repo is published: archived material, agent config,
# mastermind state, the devlog and sub-project folders stay out of the site.
name: Deploy to GitHub Pages

# Deploys on every push to main, and can be started by hand. Each deploy
# replaces the whole live site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: berserker7/game/package-lock.json

      - name: Check JavaScript syntax
        run: git ls-files -z 'ideas/*.js' 'technophage-mvp/*.js' | xargs -0 -r -n1 node --check

      - name: Install game dependencies
        run: npm ci
        working-directory: berserker7/game

      - name: Build game
        run: npm run build
        working-directory: berserker7/game

      - name: Assemble site
        run: |
          set -euo pipefail
          if [ ! -f og-image.png ]; then
            echo "::error::og-image.png not found: the landing page's link preview image has not been committed yet"
            exit 1
          fi
          if [ ! -f ideas/index.html ]; then
            echo "::error::ideas/index.html not found: the idea cloud has not been committed yet"
            exit 1
          fi
          if [ ! -f technophage-mvp/index.html ]; then
            echo "::error::technophage-mvp/index.html not found: the Technophage MVP has not been committed yet"
            exit 1
          fi
          if [ ! -f berserker7/dev/index.html ]; then
            echo "::error::berserker7/dev/index.html not found: the Berserker 7 development index has not been committed yet"
            exit 1
          fi
          if [ ! -f berserker7/dev/tracker/index.html ]; then
            echo "::error::berserker7/dev/tracker/index.html not found: the Berserker 7 feature tracker has not been committed yet"
            exit 1
          fi
          if [ ! -f berserker7/dev/tracker/tracker.json ]; then
            echo "::error::berserker7/dev/tracker/tracker.json not found: the Berserker 7 feature tracker has not been committed yet"
            exit 1
          fi
          if [ ! -f berserker7/tracker/index.html ]; then
            echo "::error::berserker7/tracker/index.html not found: the forwarding page for the tracker's old address has not been committed yet"
            exit 1
          fi
          if [ ! -f berserker7/game/dist/index.html ]; then
            echo "::error::berserker7/game/dist/index.html not found: the Berserker 7 game build produced no output"
            exit 1
          fi
          if [ -e berserker7/game/dist/tracker ]; then
            echo "::error::berserker7/game/dist/tracker exists: the game must not publish a tracker/ folder, it would collide with the tracker's forwarding page"
            exit 1
          fi
          if [ -e berserker7/game/dist/dev ]; then
            echo "::error::berserker7/game/dist/dev exists: the game must not publish a dev/ folder, it would collide with the development pages"
            exit 1
          fi
          mkdir -p _site/ideas _site/technophage-mvp _site/berserker7/dev _site/berserker7/tracker
          cp index.html og-image.png _site/
          cp -r ideas/. _site/ideas/
          cp -r technophage-mvp/. _site/technophage-mvp/
          cp -r berserker7/game/dist/. _site/berserker7/
          cp -r berserker7/dev/. _site/berserker7/dev/
          cp berserker7/tracker/index.html _site/berserker7/tracker/
          # the Technophage MVP fetches version.json (relative to its page) to show the build
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/technophage-mvp/version.json
          # list what upload-pages-artifact publishes: it skips hidden files
          # and follows symlinks
          find -L _site \( -name '.*' -prune \) -o -type f -print | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
