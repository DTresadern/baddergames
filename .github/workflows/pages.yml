# Publishes the playable games to GitHub Pages.
# Only runtime files are deployed; concept art, references and tools stay in the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: for f in technophage/src/*.js; do node --check "$f"; done

      - name: Assemble site
        run: |
          mkdir -p _site/technophage
          cp index.html _site/
          cd technophage
          cp -r index.html style.css peer-config.js src assets vendor ../_site/technophage/
          cd ..
          find _site -type f | sort

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
