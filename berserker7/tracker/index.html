<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berserker 7 Tracker</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f6f4;
  --panel: #ffffff;
  --text: #1d1f22;
  --muted: #61656b;
  --line: #d9dadc;
  --accent: #2f5d8a;
  --code-bg: #eef0f2;
  --open: #5b6068;
  --done: #1e7a3c;
  --done-bg: #e3f3e8;
  --rej: #b3261e;
  --rej-bg: #fbe7e5;
  --acc: #1f5fbf;
  --acc-bg: #e4eefc;
  --warn: #8a5a00;
  --warn-bg: #fff6e0;
  --warn-line: #e0a526;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a;
    --panel: #1d2024;
    --text: #e6e7e9;
    --muted: #9ba0a7;
    --line: #33373d;
    --accent: #8ab4e0;
    --code-bg: #262a30;
    --open: #a3a8af;
    --done: #5cc683;
    --done-bg: #183324;
    --rej: #f2877e;
    --rej-bg: #3a1d1b;
    --acc: #7fb0f5;
    --acc-bg: #172a45;
    --warn: #f0c36a;
    --warn-bg: #2e2715;
    --warn-line: #b8861d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-bottom: 6rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 2px; }
.sub { color: var(--muted); margin: 0 0 16px; font-size: .9rem; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.panel h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85em; }

/* summary */
.counts { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.counts th, .counts td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.counts th:first-child, .counts td:first-child { text-align: left; }
.counts thead th { color: var(--muted); font-weight: 600; font-size: .8rem; }
.counts tr:last-child td { border-bottom: 0; font-weight: 600; }
.table-scroll { overflow-x: auto; }
.legend { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 6px 14px; font-size: .84rem; }
.legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
.legend .meaning { color: var(--muted); }
.counts .short { display: none; }
@media (max-width: 520px) {
  .counts { font-size: .85rem; }
  .counts th, .counts td { padding: 4px 3px; }
  .counts .long { display: none; }
  .counts .short { display: inline; }
}

/* filters */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 10px; align-items: end; }
.filters label { display: flex; flex-direction: column; font-size: .8rem; color: var(--muted); gap: 3px; min-width: 0; }
.filters select, .filters input, .filters button, .loader button {
  font: inherit; font-size: .9rem; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%;
}
.filters button { cursor: pointer; }
.filters .search { grid-column: span 2; }
@media (max-width: 520px) { .filters .search { grid-column: 1 / -1; } }
.shown { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }

/* sections */
.list-section > h2 { font-size: 1.25rem; margin: 26px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--text); }
.cat > h3 { font-size: 1rem; margin: 18px 0 6px; color: var(--accent); }
.cat > h3 .n { color: var(--muted); font-weight: 400; font-size: .85rem; }
.empty { color: var(--muted); font-style: italic; }

/* rows */
.items { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.row { display: grid; grid-template-columns: 28px 1fr; gap: 0 8px; padding: 9px 12px 9px 10px; border-top: 1px solid var(--line); border-left: 4px solid transparent; }
.row:first-child { border-top: 0; }
.row.advisory { background: var(--warn-bg); border-left-color: var(--warn-line); }
.marker { width: 20px; height: 20px; margin-top: 1px; display: block; }
.marker { flex: none; }
.marker rect { fill: none; stroke: var(--open); stroke-width: 2; }
.mark-btn { all: unset; box-sizing: border-box; display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; margin: -3px 0 0 -4px; padding: 2px; border-radius: 4px; cursor: pointer; }
.mark-btn .marker { margin-top: 0; }
.mark-btn:hover { background: var(--code-bg); }
.mark-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.m-accepted rect { fill: var(--acc-bg); stroke: var(--acc); stroke-width: 2.5; }
.m-accepted path { fill: var(--acc); stroke: none; }
.m-implemented rect { fill: var(--done); stroke: var(--done); }
.m-implemented path { stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.m-rejected rect { fill: var(--rej); stroke: var(--rej); }
.m-rejected path { stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; min-width: 0; }
.id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .8rem; color: var(--muted); }
.title { font-weight: 600; overflow-wrap: anywhere; }
.row.rejected .title { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.row.rejected .detail { color: var(--muted); }
.badges { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.badge { font-size: .72rem; font-weight: 600; letter-spacing: .02em; border-radius: 999px; padding: 1px 8px; border: 1px solid currentColor; white-space: nowrap; }
.st-open { color: var(--open); }
.st-accepted { color: var(--acc); background: var(--acc-bg); }
.st-implemented { color: var(--done); background: var(--done-bg); }
.st-rejected { color: var(--rej); background: var(--rej-bg); }
.dont { color: var(--warn); border-color: var(--warn-line); background: var(--panel); }
.dont::before { content: "\26A0\FE0E  "; }
.feat { color: var(--muted); border-color: var(--line); }
.was { color: var(--accent); border: 1px dashed var(--accent); background: transparent; }
.row.changed { box-shadow: inset 0 0 0 1px var(--accent); }
.authors { font-size: .8rem; color: var(--muted); }
.detail { grid-column: 2; margin: 3px 0 0; font-size: .88rem; color: var(--text); overflow-wrap: anywhere; }
details { grid-column: 2; margin-top: 4px; font-size: .84rem; }
summary { cursor: pointer; color: var(--accent); width: fit-content; }
.srcs { margin: 6px 0 2px; padding: 0; list-style: none; }
.srcs li { margin: 0 0 7px; padding-left: 10px; border-left: 2px solid var(--line); }
.srcs code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; overflow-wrap: anywhere; word-break: break-word; }
.quote { display: block; margin-top: 2px; color: var(--text); }
.quote::before { content: "\201C"; } .quote::after { content: "\201D"; }
.shows { display: block; margin-top: 2px; color: var(--muted); font-style: italic; }
.refs { color: var(--muted); }
.refs a { color: var(--accent); }
.notes { color: var(--text); }

/* copy bar */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.copybar { position: sticky; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); box-shadow: 0 -2px 8px rgba(0,0,0,.12); padding: 8px 16px; }
.copybar-in { max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.copybar-msg { font-size: .88rem; color: var(--muted); min-width: 0; flex: 1 1 200px; }
.copybar.dirty .copybar-msg { color: var(--text); }
.copybar button { font: inherit; font-size: .9rem; font-weight: 600; color: var(--panel); background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 6px 14px; cursor: pointer; }
.copybar button:focus-visible, dialog button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.copybar button:disabled { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; opacity: .7; }
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; width: min(640px, calc(100vw - 32px)); max-width: min(640px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.5); }
dialog h2 { font-size: 1rem; margin: 0 0 8px; }
dialog textarea { display: block; width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .85rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; resize: vertical; white-space: pre; overflow-x: auto; }
dialog .hint { margin: 8px 0; font-size: .85rem; color: var(--muted); }
dialog button { font: inherit; font-size: .9rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; }

/* load error */
.loader { border-color: var(--rej); }
.loader p { margin: 0 0 10px; }
.loader input[type=file] { font: inherit; max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Berserker 7 Tracker</h1>
  <p class="sub"><span id="sub">Technical and design feature lists.</span> Status changes here are not saved: use Copy state and send the list.</p>

  <div class="panel loader" id="loader" hidden>
    <p id="loadMsg"></p>
    <label>Load tracker.json <input type="file" id="file" accept=".json,application/json"></label>
  </div>

  <div id="app" hidden>
    <div class="panel">
      <h2>Summary</h2>
      <div class="table-scroll"><table class="counts" id="counts"></table></div>
      <ul class="legend" id="legend" aria-label="Status meanings"></ul>
    </div>

    <div class="panel">
      <h2>Filter</h2>
      <div class="filters">
        <label>List<select id="fList"><option value="">All lists</option><option value="technical">Technical</option><option value="design">Design</option></select></label>
        <label>Status<select id="fStatus"><option value="">All statuses</option></select></label>
        <label>Kind<select id="fKind"><option value="">All kinds</option><option value="feature">Feature</option><option value="advisory">Don't (advisory)</option></select></label>
        <label>Category<select id="fCat"><option value="">All categories</option></select></label>
        <label class="search">Search<input id="fText" type="search" placeholder="id, title, detail, author, quote, ref"></label>
        <label>&nbsp;<button id="fReset" type="button">Reset filters</button></label>
      </div>
      <p class="shown" id="shown"></p>
    </div>

    <div id="lists"></div>
  </div>
</div>

<div class="copybar" id="copybar" hidden>
  <div class="copybar-in">
    <span class="copybar-msg" id="copyMsg">No changes</span>
    <button type="button" id="copyBtn" disabled>Copy state (0)</button>
  </div>
</div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>
<dialog id="copyDlg" aria-labelledby="copyDlgH">
  <h2 id="copyDlgH">Copy these status changes</h2>
  <textarea id="copyTxt" readonly rows="8" wrap="off"></textarea>
  <p class="hint">Press Ctrl+C (⌘C on Mac) to copy.</p>
  <button type="button" id="copyClose">Close</button>
</dialog>

<script>
(function () {
  "use strict";
  var LISTS = [["technical", "Technical"], ["design", "Design"]];
  var MARK_PATHS = { open: null, accepted: "M7.5 5.5l6 4.5-6 4.5z", implemented: "M5.5 10.5l3 3 6-7", rejected: "M6 6l8 8M14 6l-8 8" };
  var STORE = "berserker7-tracker-filters";
  var data = null;
  var loaded = {};
  var CYCLE = ["open", "accepted", "rejected"];
  var copiedTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function marker(status) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 20 20");
    svg.setAttribute("class", "marker m-" + status);
    svg.setAttribute("aria-hidden", "true");
    var r = document.createElementNS(ns, "rect");
    r.setAttribute("x", "2"); r.setAttribute("y", "2");
    r.setAttribute("width", "16"); r.setAttribute("height", "16"); r.setAttribute("rx", "3");
    svg.appendChild(r);
    var shape = MARK_PATHS[status];
    if (shape) {
      var p = document.createElementNS(ns, "path");
      p.setAttribute("d", shape);
      svg.appendChild(p);
    }
    return svg;
  }

  function saveFilters() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        list: $("fList").value, status: $("fStatus").value, kind: $("fKind").value,
        cat: $("fCat").value, text: $("fText").value
      }));
    } catch (e) { /* storage unavailable */ }
  }
  function loadFilters() {
    try { return JSON.parse(localStorage.getItem(STORE) || "null") || {}; } catch (e) { return {}; }
  }

  function setOptions(sel, values, keep) {
    var first = sel.options[0];
    sel.textContent = "";
    sel.appendChild(first);
    values.forEach(function (v) {
      var o = el("option", null, v[1]); o.value = v[0]; sel.appendChild(o);
    });
    sel.value = values.some(function (v) { return v[0] === keep; }) ? keep : "";
  }

  function categories(list) {
    var seen = {}, out = [];
    data.items.forEach(function (it) {
      if (list && it.list !== list) return;
      var key = it.category;
      if (!seen[key]) { seen[key] = 1; out.push([key, key]); }
    });
    return out.sort(function (a, b) { return a[0].localeCompare(b[0]); });
  }

  function renderCounts() {
    var t = $("counts");
    t.textContent = "";
    var statuses = data.statuses;
    var thead = el("thead"), hr = el("tr");
    var SHORT = { open: "Open", accepted: "Acc.", implemented: "Done", rejected: "Rej." };
    var heads = [["List", "List"]].concat(statuses.map(function (s) { return [cap(s), SHORT[s] || cap(s)]; }),
      [["Features", "Feat."], ["Don'ts", "Don't"], ["Total", "All"]]);
    heads.forEach(function (h) {
      var th = el("th");
      th.title = h[0];
      th.appendChild(el("span", "long", h[0]));
      th.appendChild(el("span", "short", h[1]));
      hr.appendChild(th);
    });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el("tbody");
    function row(label, items) {
      var tr = el("tr");
      tr.appendChild(el("td", null, label));
      statuses.forEach(function (s) {
        tr.appendChild(el("td", null, String(items.filter(function (i) { return i.status === s; }).length)));
      });
      tr.appendChild(el("td", null, String(items.filter(function (i) { return i.kind === "feature"; }).length)));
      tr.appendChild(el("td", null, String(items.filter(function (i) { return i.kind === "advisory"; }).length)));
      tr.appendChild(el("td", null, String(items.length)));
      tb.appendChild(tr);
    }
    LISTS.forEach(function (l) { row(l[1], data.items.filter(function (i) { return i.list === l[0]; })); });
    row("All", data.items);
    t.appendChild(tb);
  }

  function haystack(it) {
    var parts = [it.id, it.title, it.detail, it.category, it.status, it.kind, it.notes || ""]
      .concat(it.authors || [], it.refs || []);
    (it.sources || []).forEach(function (s) { parts.push(s.file, s.quote || "", s.shows || ""); });
    return parts.join(" \n ").toLowerCase();
  }

  function renderRefs(refs) {
    var div = el("div", "refs", "Cross-references: ");
    var tracker = refs.filter(function (r) { return /^[DT]-\d+$/.test(r); });
    var earlier = refs.filter(function (r) { return tracker.indexOf(r) === -1; });
    tracker.forEach(function (r, n) {
      if (n) div.appendChild(document.createTextNode(", "));
      var a = el("a", null, r);
      a.href = "#" + r;
      div.appendChild(a);
    });
    if (earlier.length) {
      div.appendChild(document.createTextNode((tracker.length ? "; " : "") + earlier.join(", ") + " (feedback-and-ideas.html)"));
    }
    return div;
  }

  function nextStatus(it) {
    if (loaded[it.id] === "implemented") return null;
    var at = CYCLE.indexOf(it.status);
    for (var k = 1; k < CYCLE.length; k++) {
      var cand = CYCLE[(at + k) % CYCLE.length];
      if (data.statuses.indexOf(cand) !== -1) return cand;
    }
    return null;
  }

  function changedItems() {
    return data.items.filter(function (it) { return it.status !== loaded[it.id]; });
  }

  function announce(msg) {
    var live = $("live");
    live.textContent = "";
    setTimeout(function () { live.textContent = msg; }, 30);
  }

  function renderItem(it) {
    var changed = it.status !== loaded[it.id];
    var li = el("li", "row " + it.status + (it.kind === "advisory" ? " advisory" : "") + (changed ? " changed" : ""));
    li.id = it.id;
    var next = nextStatus(it);
    if (next) {
      var btn = el("button", "mark-btn");
      btn.type = "button";
      btn.setAttribute("aria-label", it.id + " " + it.title + ": " + cap(it.status) + ". Set to " + cap(next));
      btn.title = "Set to " + cap(next);
      btn.appendChild(marker(it.status));
      btn.addEventListener("click", function () { cycle(it, next); });
      li.appendChild(btn);
    } else {
      li.appendChild(marker(it.status));
    }
    var head = el("div", "head");
    head.appendChild(el("span", "id", it.id));
    head.appendChild(el("span", "title", it.title));
    var badges = el("span", "badges");
    badges.appendChild(el("span", "badge st-" + it.status, cap(it.status)));
    if (changed) badges.appendChild(el("span", "badge was", "was " + cap(loaded[it.id])));
    badges.appendChild(it.kind === "advisory" ? el("span", "badge dont", "Don't") : el("span", "badge feat", "Feature"));
    head.appendChild(badges);
    head.appendChild(el("span", "authors", (it.authors || []).join(", ")));
    li.appendChild(head);
    li.appendChild(el("p", "detail", it.detail));

    var det = el("details");
    var n = (it.sources || []).length;
    var label = n + (n === 1 ? " source" : " sources");
    if (it.refs && it.refs.length) label += " · refs " + it.refs.join(", ");
    if (it.notes) label += " · notes";
    det.appendChild(el("summary", null, label));
    var ul = el("ul", "srcs");
    (it.sources || []).forEach(function (s) {
      var sli = el("li");
      sli.appendChild(el("code", null, s.file));
      if (s.quote) sli.appendChild(el("span", "quote", s.quote));
      if (s.shows) sli.appendChild(el("span", "shows", "Image shows: " + s.shows));
      ul.appendChild(sli);
    });
    det.appendChild(ul);
    if (it.refs && it.refs.length) det.appendChild(renderRefs(it.refs));
    if (it.notes) det.appendChild(el("div", "notes", "Notes: " + it.notes));
    li.appendChild(det);
    return li;
  }

  function render() {
    var f = {
      list: $("fList").value, status: $("fStatus").value, kind: $("fKind").value,
      cat: $("fCat").value, text: $("fText").value.trim().toLowerCase()
    };
    var root = $("lists");
    root.textContent = "";
    var shown = 0;
    LISTS.forEach(function (l) {
      if (f.list && f.list !== l[0]) return;
      var sec = el("section", "list-section");
      sec.setAttribute("data-list", l[0]);
      var items = data.items.filter(function (it) {
        return it.list === l[0] &&
          (!f.status || it.status === f.status) &&
          (!f.kind || it.kind === f.kind) &&
          (!f.cat || it.category === f.cat) &&
          (!f.text || haystack(it).indexOf(f.text) !== -1);
      });
      var total = data.items.filter(function (it) { return it.list === l[0]; }).length;
      sec.appendChild(el("h2", null, l[1] + " (" + items.length + " of " + total + ")"));
      if (!items.length) sec.appendChild(el("p", "empty", "No items match the filters."));
      var cats = {}, order = [];
      items.forEach(function (it) {
        if (!cats[it.category]) { cats[it.category] = []; order.push(it.category); }
        cats[it.category].push(it);
      });
      order.sort(function (a, b) { return a.localeCompare(b); });
      order.forEach(function (c) {
        var cs = el("section", "cat");
        var h = el("h3", null, c + " ");
        h.appendChild(el("span", "n", "(" + cats[c].length + ")"));
        cs.appendChild(h);
        var ul = el("ul", "items");
        cats[c].forEach(function (it) { ul.appendChild(renderItem(it)); });
        cs.appendChild(ul);
        sec.appendChild(cs);
      });
      shown += items.length;
      root.appendChild(sec);
    });
    $("shown").textContent = "Showing " + shown + " of " + data.items.length + " items.";
    updateBar();
    saveFilters();
  }

  function cycle(it, next) {
    var openIds = {};
    [].forEach.call(document.querySelectorAll("#lists .row"), function (row) {
      var d = row.querySelector("details");
      if (d && d.open) openIds[row.id] = true;
    });
    var order = [].map.call(document.querySelectorAll("#lists .row"), function (row) { return row.id; });
    clearTimeout(copiedTimer);
    copiedTimer = null;
    it.status = next;
    renderCounts();
    render();
    [].forEach.call(document.querySelectorAll("#lists .row"), function (row) {
      if (openIds[row.id]) row.querySelector("details").open = true;
    });
    var row = document.getElementById(it.id);
    if (row) {
      row.querySelector(".mark-btn").focus();
      announce(it.id + " set to " + cap(next) + ".");
      return;
    }
    var target = order.slice(order.indexOf(it.id) + 1).reduce(function (found, id) {
      var r = document.getElementById(id);
      return found || (r && r.querySelector(".mark-btn"));
    }, null);
    (target || ($("copyBtn").disabled ? $("fStatus") : $("copyBtn"))).focus();
    announce(it.id + " set to " + cap(next) + "; hidden by the filters.");
  }

  function copyText(ch) {
    var lines = [(data.project || "Tracker") + " tracker: " + ch.length + " status change" + (ch.length === 1 ? "" : "s")];
    ch.forEach(function (it) {
      lines.push(it.id + ": " + loaded[it.id] + " \u2192 " + it.status + " (" + it.title + ")");
    });
    return lines.join("\n");
  }

  function updateBar() {
    var n = changedItems().length;
    var btn = $("copyBtn");
    $("copybar").className = "copybar" + (n ? " dirty" : "");
    $("copyMsg").textContent = n ? n + " changed \u00b7 not saved until copied and sent" : "No changes";
    btn.disabled = n === 0;
    if (!copiedTimer) btn.textContent = "Copy state (" + n + ")";
  }

  function showFallback(text) {
    var dlg = $("copyDlg"), ta = $("copyTxt");
    ta.value = text;
    ta.rows = Math.min(14, text.split("\n").length + 1);
    if (!dlg.open) dlg.showModal();
    ta.focus();
    ta.select();
    ta.scrollLeft = 0;
    ta.scrollTop = 0;
  }

  function copyState() {
    var ch = changedItems();
    var n = ch.length;
    if (!n) return;
    var text = copyText(ch);
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () {
        clearTimeout(copiedTimer);
        $("copyBtn").textContent = "Copied";
        copiedTimer = setTimeout(function () { copiedTimer = null; updateBar(); }, 1500);
        announce("Copied " + n + " status change" + (n === 1 ? "" : "s") + ".");
      }, function () { showFallback(text); });
    } else {
      showFallback(text);
    }
  }

  function start(json) {
    if (!json || !Array.isArray(json.items) || !Array.isArray(json.statuses)) {
      throw new Error("The file is not a tracker: it has no items or statuses list.");
    }
    json.statuses.forEach(function (st) {
      if (!Object.prototype.hasOwnProperty.call(MARK_PATHS, st)) throw new Error("unknown status \"" + st + "\" in statuses; this page shows " + Object.keys(MARK_PATHS).join(", ") + ".");
    });
    if (json.statusMeanings != null && (typeof json.statusMeanings !== "object" || Array.isArray(json.statusMeanings))) {
      throw new Error("statusMeanings must be an object of status: meaning.");
    }
    var lists = LISTS.map(function (l) { return l[0]; });
    json.items.forEach(function (it, n) {
      var ok = it && typeof it.id === "string" && typeof it.title === "string" &&
        typeof it.category === "string" && lists.indexOf(it.list) !== -1 &&
        json.statuses.indexOf(it.status) !== -1;
      if (!ok) throw new Error("item " + (n + 1) + " (" + ((it && it.id) || "no id") + ") has a missing or invalid id, title, list, status or category.");
    });
    data = json;
    loaded = {};
    json.items.forEach(function (it) { loaded[it.id] = it.status; });
    $("loader").hidden = true;
    $("app").hidden = false;
    $("copybar").hidden = false;
    $("sub").textContent = (json.project || "Tracker") + " · " + json.items.length + " items · updated " + (json.updated || "unknown") + ".";
    var saved = loadFilters();
    setOptions($("fStatus"), json.statuses.map(function (s) { return [s, cap(s)]; }), saved.status);
    selectIfOption($("fList"), saved.list);
    selectIfOption($("fKind"), saved.kind);
    setOptions($("fCat"), categories($("fList").value), saved.cat);
    $("fText").value = saved.text || "";
    renderCounts();
    renderLegend();
    render();
  }

  function renderLegend() {
    var ul = $("legend");
    ul.textContent = "";
    var meanings = data.statusMeanings || {};
    data.statuses.forEach(function (st) {
      var li = el("li");
      li.appendChild(marker(st));
      li.appendChild(el("span", "badge st-" + st, cap(st)));
      if (typeof meanings[st] === "string") li.appendChild(el("span", "meaning", meanings[st]));
      ul.appendChild(li);
    });
  }

  function selectIfOption(sel, value) {
    var known = [].some.call(sel.options, function (o) { return o.value === value; });
    sel.value = known ? value : "";
  }

  function showLoader(msg) {
    $("loadMsg").textContent = msg;
    $("loader").hidden = false;
  }

  $("copyBtn").addEventListener("click", copyState);
  $("copyClose").addEventListener("click", function () { $("copyDlg").close(); });
  window.addEventListener("beforeunload", function (e) {
    if (data && changedItems().length) { e.preventDefault(); e.returnValue = ""; }
  });
  $("fList").addEventListener("change", function () {
    setOptions($("fCat"), categories($("fList").value), $("fCat").value);
    render();
  });
  ["fStatus", "fKind", "fCat"].forEach(function (id) { $(id).addEventListener("change", render); });
  $("fText").addEventListener("input", render);
  $("fReset").addEventListener("click", function () {
    $("fList").value = ""; $("fStatus").value = ""; $("fKind").value = ""; $("fText").value = "";
    setOptions($("fCat"), categories(""), "");
    render();
  });
  $("file").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try { start(JSON.parse(reader.result)); }
      catch (e) { showLoader("Could not read " + file.name + ": " + e.message); }
    };
    reader.onerror = function () { showLoader("Could not read " + file.name + "."); };
    reader.readAsText(file);
  });

  fetch("tracker.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(start)
    .catch(function (e) {
      showLoader(location.protocol === "file:"
        ? "Could not load tracker.json automatically (" + e.message + "): browsers block this when the page is opened as a local file. Serve the folder over HTTP, or choose tracker.json below."
        : "Could not load tracker.json (" + e.message + "). Check that the file exists and is valid, or choose a file below.");
    });
})();
</script>
</body>
</html>
